### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
trust_remote_code: true
image_max_pixels: 1605632
image_min_pixels: 3136

### method
stage: sft
do_train: true
finetuning_type: lora
freeze_vision_tower: true
lora_rank: 64
lora_alpha: 128
lora_target: all
lora_dropout: 0.05
use_diff_token_weighted_loss: true

### dataset
# dataset_dir 은 여기 적지 않는다 — 절대경로여야 하고(상대경로는 다른 cwd 가 만든 stale
# HF datasets 캐시를 재사용해 이미지 FileNotFoundError 를 낸다) 머신마다 다르므로
# scripts/run_exp09_stage1.sh 가 런타임에 주입한다 (_common.sh::resolve_overrides 와 동일 규약).
dataset: IWM-AC_EXP09_stage1_train_time_mgmt
template: qwen2_vl
cutoff_len: 24576
overwrite_cache: false
preprocessing_num_workers: 16
media_dir: ../data

### output
output_dir: ../outputs/AndroidControl_EXP09/adapters/qwen2.5-vl-3b_time-mgmt_stage1_lora
logging_steps: 1
save_strategy: steps
# 정수 step. EXP08 의 save_steps=0.25 (float ratio) 는 전체 step 수에 대한 균등 분할이라
# 0.25/0.5/0.75/1/2/3 epoch 를 정확히 짚지 못한다. Train 은 length filter 로 4000 →
# 3996 (cutoff_len 24576 초과 4행 제외, build_exp09_data.py 참조). 3996/37 = 108
# step/epoch 이므로 27 step = 0.25 epoch → 목표 6 지점이 정수 global step 에 정확히 떨어진다.
save_steps: 27
# 3 epoch 동안 12 회 저장되므로 5 (EXP08) 로는 오래된 체크포인트가 삭제된다.
save_total_limit: 20
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
# world_size=1 · pdbs=1 · train=3996 (post length-filter) 에서 3996 / 37 = 108
# optimizer step/epoch (나머지 0). 37 은 999(=3996/4)의 약수 중 원래 값 40 에 가장 가까움.
gradient_accumulation_steps: 37
learning_rate: 1.0e-4
num_train_epochs: 3
lr_scheduler_type: cosine
warmup_ratio: 0.03
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
gradient_checkpointing: true
seed: 42
ddp_timeout: 18000000
